        <h1>报告问题</h1>
        <p>先完全退出 MyAppx Desktop，再收集日志。日志目录：</p>
        <p><code>%AppData%\Roaming\MyAppxDesktop\logs</code></p>
        <p>若安装失败，确认没有正在运行的 <code>MyAppxDesktop.exe</code>，然后重新下载 <a href="index.html">当前安装包</a>。</p>
