<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>升级 MyAppx Desktop</title>
    <link rel="icon" type="image/png" href="myappx-icon.png">
    <link rel="stylesheet" href="docs.css">
</head>
<body>
    <main>
        <h1>升级 MyAppx Desktop</h1>
        <p>升级前请完全退出 MyAppx Desktop。客户端仍在运行时，安装程序可能因文件占用而失败。</p>
        <h2>应用内升级</h2>
        <ol>
            <li>收到新版本通知后，点击 Download Update。</li>
            <li>下载完成后，选择 Restart and install。</li>
            <li>应用退出后，安装程序完成升级。</li>
        </ol>
        <h2>手动升级</h2>
        <ol>
            <li>通过 File → Quit 或托盘图标退出应用。</li>
            <li>运行 <a href="index.html">/desktop</a> 上的新版本安装程序。</li>
        </ol>
    </main>
</body>
</html>
